concurrency:
  cancel-in-progress: true
  group: "${{ github.workflow }}-${{ github.ref }}"
jobs:
  update:
    permissions:
      contents: "write"
    runs-on: "ubuntu-latest"
    steps:
    - name: "Checkout rsdk"
      uses: "actions/checkout@v7"
      with:
        ref: "66bdd2b23469bff52bc8b4e03cb572f6b7112ce2"
        repository: "RadxaOS-SDK/rsdk"
    - name: "Checkout current repo"
      uses: "actions/checkout@v7"
      with:
        path: ".infra-repo"
        token: "${{secrets.CODE_WRITE_TOKEN}}"
    - env:
        GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      id: "build"
      name: "Update pkgs.json"
      run: |
        pushd .infra-repo
        if [[ "${{ github.repository }}" != *-test ]] && \
            wget "https://raw.githubusercontent.com/${{ github.repository }}-test/main/pkgs.lock" -O pkgs.lock.new; then
            mv pkgs.lock.new pkgs.lock
            git add pkgs.lock
        fi
        
        # Clean up wget file in case it failed (for example no lock in test repo)
        rm -f pkgs.lock.new
        
        ../src/bin/rsdk infra-pkg-snapshot
        git add pkgs.json
        
        if [[ -n "$(git status --porcelain)" ]]; then
            git config --global user.name 'github-actions[bot]'
            git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "chore: update package snapshot"
        fi
        popd
      shell: "bash"
    - if: "github.event_name != 'pull_request'"
      name: "Commit package snapshot"
      run: |
        pushd .infra-repo
        git push
        popd
      shell: "bash"
    timeout-minutes: 10
name: "Update package version info"
"on":
  pull_request:
    paths:
    - ".github/workflows/update.yaml"
  repository_dispatch:
    types:
    - "new_package_release"
  workflow_dispatch: {}
permissions: {}
